name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the automation scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned release-please package
        run: >-
          npm install --prefix "$RUNNER_TEMP/release-please"
          --no-package-lock --no-audit --no-fund --ignore-scripts
          release-please@17.3.0
      - name: Create or update the release PR only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export NODE_PATH="$RUNNER_TEMP/release-please/node_modules"
          node scripts/release-please-pr.cjs
