name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-coverage:
    name: Tests and coverage (Rust 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the coverage tool with stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-llvm-cov --version 0.8.7 --locked
      - name: Install the minimum supported Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component llvm-tools-preview
          rustup default 1.85.0
      - name: Test all features and documentation examples
        run: cargo test --workspace --all-features --locked
      - name: Test without default features
        run: cargo test --workspace --no-default-features --locked
      - name: Require at least 90 percent production-line coverage
        run: bash scripts/check-coverage.sh

  clippy:
    name: Clippy (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable Rust and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Reject Clippy warnings for all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
