[package]
name = "tencentcloud-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "licenses/Apache-2.0.txt"]
description = "A modular Tencent Cloud SDK for Rust"

[workspace]
resolver = "3"
members = ["crates/core", "crates/cos", "crates/ses", "crates/ssm"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/joehe71/tencentcloud-sdk"

[workspace.dependencies]
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.13"
http = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
sha1 = "0.10"
percent-encoding = "2"
quick-xml = { version = "0.41", features = ["serialize"] }
md-5 = "0.10"
base64 = "0.23"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[features]
default = []
credentials-file = ["tencentcloud-sdk-core/credentials-file"]
credentials-roles = ["tencentcloud-sdk-core/credentials-roles"]
transport-reqwest = ["tencentcloud-sdk-core/transport-reqwest", "tencentcloud-sdk-cos?/transport-reqwest"]
cos = ["dep:tencentcloud-sdk-cos"]
ses = ["dep:tencentcloud-sdk-ses"]
ssm = ["dep:tencentcloud-sdk-ssm"]

[dependencies]
tencentcloud-sdk-core = { version = "0.1.0", path = "crates/core", default-features = false }

[dependencies.tencentcloud-sdk-cos]
version = "0.1.0"
path = "crates/cos"
optional = true
default-features = false

[dependencies.tencentcloud-sdk-ses]
version = "0.1.0"
path = "crates/ses"
optional = true
default-features = false

[dependencies.tencentcloud-sdk-ssm]
version = "0.1.0"
path = "crates/ssm"
optional = true
default-features = false

[lints]
workspace = true
