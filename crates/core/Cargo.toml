[package]
name = "tencentcloud-sdk-foundation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
description = "Client, TC3 signing, and transport core for Tencent Cloud API 3.0"

[features]
default = []
cos-signing = ["dep:sha1", "dep:percent-encoding"]
credentials-file = ["tokio/fs", "tokio/io-util"]
credentials-roles = ["credentials-file", "tokio/sync"]
transport-reqwest = ["dep:reqwest", "dep:futures-util"]

[dependencies]
bytes.workspace = true
futures-core.workspace = true
futures-util = { workspace = true, optional = true }
hmac.workspace = true
http.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1 = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
time.workspace = true
tokio.workspace = true

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "net", "io-util", "sync"] }

[lints]
workspace = true
