[package]
name = "tencentcloud-sdk-cos"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]
description = "Bounded asynchronous Tencent Cloud COS XML API client"

[features]
default = []
transport-reqwest = ["tencentcloud-sdk-foundation/transport-reqwest"]

[dependencies]
tencentcloud-sdk-foundation = { path = "../core", version = "0.2.1", default-features = false, features = ["cos-signing"] }
bytes.workspace = true
http.workspace = true
futures-util.workspace = true
serde.workspace = true
quick-xml.workspace = true
base64.workspace = true
md-5.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "net", "io-util"] }

[lints]
workspace = true
