[package]
name = "tencentcloud-sdk-ssm"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]
description = "Typed asynchronous Tencent Cloud Secrets Manager API client"

[dependencies]
tencentcloud-sdk-foundation = { version = "0.2.1", path = "../core", default-features = false }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
